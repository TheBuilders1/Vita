[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vita-backend"
version = "0.1.0"
description = "Backend de demostración de Vita con FastAPI y OpenClaw"
requires-python = ">=3.11"
dependencies = [
  "cryptography>=50,<51",
  "fastapi>=0.115,<1",
  "google-auth>=2.40,<3",
  "google-auth-oauthlib>=1.2,<2",
  "httpx>=0.27,<1",
  "pillow>=13,<14",
  "psycopg[binary]>=3.2,<4",
  "python-multipart>=0.0.12,<1",
  "uvicorn[standard]>=0.30,<1",
]

[project.optional-dependencies]
dev = [
  "pytest>=9.0.3,<10",
  "setuptools>=84.2.1",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools.packages.find]
include = ["app*"]
