[project]
name = "vita"
version = "0.0.1"
description = "Harness orquestador de nubes de agentes hiperespecializados"
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.27",
    "pydantic>=2.7",
    "pyyaml>=6.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["vita*"]
