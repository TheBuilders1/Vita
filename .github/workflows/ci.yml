name: CI

on:
  pull_request:
  push:
    branches: [main, development]

permissions:
  contents: read

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check

  backend:
    runs-on: ubuntu-latest
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: vita_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vita_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa postgresql-client
      - run: python -m pip install -e '.[dev]'
      - name: Crear roles y esquemas
        run: sh database/init/01-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci
          POSTGRES_USER: postgres
          POSTGRES_DB: vita_test
          VITA_API_PASSWORD: ci-api
          VITA_MIGRATOR_PASSWORD: ci-migrator
      - run: python -m pytest
        env:
          VITA_TEST_DATABASE_URL: postgresql://vita_api:ci-api@127.0.0.1:5432/vita_test
          VITA_TEST_MIGRATION_DATABASE_URL: postgresql://vita_migrator:ci-migrator@127.0.0.1:5432/vita_test
