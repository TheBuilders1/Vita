name: Despliegue

on:
  push:
    branches: [main, development]
  pull_request:
  workflow_dispatch:
    inputs:
      maintenance:
        description: 'Publicar la página de mantenimiento en lugar de la web'
        type: boolean
        default: false

# Por defecto sin permisos; cada job pide solo lo que necesita
permissions: {}

concurrency:
  group: deploy-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  MAINTENANCE: ${{ inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true' }}
  SITE_URL: ${{ vars.SITE_URL || format('https://{0}.github.io/{1}/', github.repository_owner, github.event.repository.name) }}

jobs:
  guardian:
    name: 'Guardián: ficheros y protecciones'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # para revisar los commits del PR
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - name: Ficheros versionados, estructura y endurecimiento
        run: node tools/guard.mjs
      - run: node --test "tools/*.test.mjs"
      - name: Commits del PR en formato Conventional Commits
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: node tools/commit-msg.mjs --range "$BASE_SHA..$HEAD_SHA"

  agentes:
    name: 'Agentes: contrato de mínimo privilegio'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
      - run: node tools/agents.mjs

  calidad:
    name: 'Calidad: lint, tipos y pruebas'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test

  workflows:
    name: 'Flujos: actionlint y zizmor'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Lint de workflows (actionlint)
        run: docker run --rm -v "$PWD:/repo" -w /repo rhysd/actionlint:1.7.12 -color
      - name: Auditoría de seguridad de workflows (zizmor)
        run: pipx run zizmor==1.33.1 --offline --min-severity=medium .github/workflows

  secretos:
    name: 'Secretos: gitleaks'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0 # todo el historial: un secreto borrado sigue en git
      - name: Escaneo de credenciales (gitleaks)
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --config /repo/.github/gitleaks.toml --redact --verbose

  dependencias:
    name: 'Dependencias: auditoría y revisión'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - name: Lockfile coherente con package.json
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Vulnerabilidades conocidas (pnpm audit)
        run: pnpm audit --audit-level=moderate
      - name: Revisión de dependencias nuevas del PR
        if: github.event_name == 'pull_request'
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294 # v5.0.0
        with:
          fail-on-severity: moderate

  codeql:
    name: 'CodeQL: análisis estático'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
      security-events: write
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: github/codeql-action/init@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
        with:
          languages: javascript-typescript, python, actions
          queries: security-extended
      - uses: github/codeql-action/analyze@33d7b85da1a04171e211befe2c739303b9a4c066 # v4.39.3
      # analyze termina en verde aunque encuentre fallos: aquí se decide
      - name: Sin alertas abiertas de gravedad alta o crítica
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/code-scanning/alerts?tool_name=CodeQL&state=open&ref=$GITHUB_REF&per_page=100" \
            --jq '.[] | select(.rule.security_severity_level == "high" or .rule.security_severity_level == "critical") | "\(.rule.id) \(.most_recent_instance.location.path):\(.most_recent_instance.location.start_line)"' > alertas
          cat alertas
          test ! -s alertas

  build:
    name: 'Compilar la web'
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: frontend/dist
          if-no-files-found: error
          retention-days: 3

  lighthouse:
    name: 'Lighthouse: rendimiento y accesibilidad'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: frontend/dist
      - name: Medir la portada publicada en su ruta
        run: |
          ruta=$(node -p "new URL(process.env.SITE_URL).pathname.replace(/\/?$/, '/')")
          pnpm dlx @lhci/cli@0.16.1 autorun --config=.github/lighthouserc.json --collect.url="http://127.0.0.1:4500${ruta}"

  e2e:
    name: 'E2E: Playwright'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: frontend/dist
      - name: Navegador de Playwright
        run: pnpm exec playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (escritorio y móvil)
        run: pnpm e2e

  backend:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    timeout-minutes: 20
    if: ${{ github.event_name == 'pull_request' || !(inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    services:
      db:
        image: postgres:16-alpine
        env:
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: vita_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d vita_test"
          --health-interval 3s --health-timeout 3s --health-retries 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pyproject.toml
      - run: sudo apt-get update && sudo apt-get install -y --no-install-recommends tesseract-ocr tesseract-ocr-spa postgresql-client
      - run: python -m pip install -e '.[dev]'
      - name: Crear roles y esquemas
        run: sh database/init/01-roles.sh
        env:
          PGHOST: 127.0.0.1
          PGPASSWORD: ci
          POSTGRES_USER: postgres
          POSTGRES_DB: vita_test
          VITA_API_PASSWORD: ci-api
          VITA_MIGRATOR_PASSWORD: ci-migrator
      - run: python -m pytest
        env:
          VITA_TEST_DATABASE_URL: postgresql://vita_api:ci-api@127.0.0.1:5432/vita_test
          VITA_TEST_MIGRATION_DATABASE_URL: postgresql://vita_migrator:ci-migrator@127.0.0.1:5432/vita_test
      - name: Auditar las dependencias instaladas
        run: |
          python -m pip freeze --exclude-editable > "$RUNNER_TEMP/requirements.txt"
          pipx run pip-audit==2.10.1 --strict --disable-pip --no-deps -r "$RUNNER_TEMP/requirements.txt"
      - name: Verificar el usuario de la imagen
        run: |
          docker build -t vita-api .
          test "$(docker run --rm --entrypoint id vita-api -u)" = 10001

  empaquetar:
    name: Empaquetar web
    needs: [guardian, agentes, calidad, workflows, secretos, dependencias, codeql, build, lighthouse, e2e, backend]
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/development'
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      id-token: write # firma de la atestación (Sigstore)
      attestations: write
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Atestación de procedencia (SLSA)
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-path: 'dist/**/*'
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: dist

  mantenimiento:
    name: Página de mantenimiento
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/development' && (inputs.maintenance == true || vars.MAINTENANCE_MODE == 'true') }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # 404.html hace que cualquier ruta muestre también el mantenimiento
      - name: Preparar sitio de mantenimiento
        run: |
          mkdir "$RUNNER_TEMP/site"
          cp .github/pages/maintenance.html "$RUNNER_TEMP/site/index.html"
          cp .github/pages/maintenance.html "$RUNNER_TEMP/site/404.html"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dist
          path: ${{ runner.temp }}/site
          retention-days: 3
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: ${{ runner.temp }}/site

  deploy:
    name: Desplegar en GitHub Pages
    needs: [empaquetar, mantenimiento]
    # Uno de los dos caminos terminó bien y el otro se saltó; nunca en PRs
    if: >-
      ${{ always() && github.event_name != 'pull_request' && github.ref == 'refs/heads/development' &&
          !contains(needs.*.result, 'failure') && !contains(needs.*.result, 'cancelled') &&
          contains(needs.*.result, 'success') }}
    timeout-minutes: 10
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Solo la última versión de la rama (repetir un despliegue antiguo no la sustituye)
        env:
          GH_TOKEN: ${{ github.token }}
        run: test "$(gh api "repos/$GITHUB_REPOSITORY/commits/development" --jq .sha)" = "$GITHUB_SHA"
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1

  humo:
    name: Prueba de humo en producción
    needs: deploy
    # always() porque deploy depende de un job saltado (empaquetar o mantenimiento)
    if: ${{ always() && needs.deploy.result == 'success' }}
    runs-on: ubuntu-latest
    permissions: {}
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: dist
          path: dist
      - name: Comparar la publicación con los archivos revisados
        run: |
          base="${SITE_URL%/}/"
          for intento in {1..10}; do
            if curl -fsSL --max-time 10 "$base" -o portada && cmp -s dist/index.html portada; then break; fi
            echo "Esperando la portada revisada (intento $intento)"
            sleep 10
          done
          cmp dist/index.html portada
          esperado='<title>Vita</title>'
          if [[ "$MAINTENANCE" == true ]]; then esperado='Volvemos enseguida'; fi
          grep -Fq "$esperado" portada
          grep -Fq 'http-equiv="Content-Security-Policy"' portada
          codigo=$(curl -sSL --max-time 20 -o respuesta -w '%{http_code}' "${base}no-existe-$RANDOM")
          test "$codigo" = 404
          cmp portada respuesta
          find dist -type f -print0 > archivos
          while IFS= read -r -d '' archivo; do
            ruta=$(jq -rn --arg ruta "${archivo#dist/}" '$ruta | split("/") | map(@uri) | join("/")')
            curl -fsSL --max-time 20 "${base}${ruta}?v=${GITHUB_SHA}" -o respuesta
            cmp "$archivo" respuesta
          done < archivos
